[package]
name = "valo-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Core logic for valo, a self-hosted embedded auth library"

[features]
resend = ["dep:resend-rs"]
sendgrid = []  # uses the core reqwest dep (rustls); no separate crate (sendgrid 0.27 has no rustls)
ses = ["dep:aws-sdk-sesv2", "dep:aws-config"]
smtp = ["dep:lettre"]

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "time", "macros"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
argon2 = "0.5.3"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
resend-rs = { version = "0.25", optional = true, default-features = false, features = ["rustls-tls"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["rustls"] }
aws-sdk-sesv2 = { version = "1", optional = true, default-features = false, features = ["rustls"] }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool", "hostname"] }
totp-rs = { version = "5", default-features = false, features = ["otpauth", "gen_secret"] }
aes-gcm = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
